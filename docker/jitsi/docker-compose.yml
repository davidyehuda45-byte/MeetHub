version: '3.8'

services:
  # 1. Jitsi Web Frontend
  web:
    image: jitsi/web:stable-9646
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./config/web:/config:Z
      - ./config/transcripts:/usr/share/jitsi-meet/transcripts:Z
    environment:
      - ENABLE_AUTH=1
      - ENABLE_GUESTS=1
      - AUTH_TYPE=jwt
      - JWT_APP_ID=${JWT_APP_ID:-meethub}
      - JWT_APP_SECRET=${JWT_APP_SECRET:-meethub_super_secret_jwt_key_2026_dev_32bytes}
      - JWT_ACCEPTED_ISSUERS=${JWT_APP_ID:-meethub}
      - JWT_ACCEPTED_AUDIENCES=${JWT_APP_ID:-meethub}
      - PUBLIC_URL=${PUBLIC_URL:-https://meet.yourdomain.com}
      - XMPP_AUTH_DOMAIN=auth.meet.jitsi
      - XMPP_BOSH_URL_BASE=http://prosody:5280
      - XMPP_DOMAIN=meet.jitsi
      - XMPP_GUEST_DOMAIN=guest.meet.jitsi
      - XMPP_MUC_DOMAIN=muc.meet.jitsi
    networks:
      meet.jitsi:

  # 2. Prosody XMPP Server (JWT Authentication Core)
  prosody:
    image: jitsi/prosody:stable-9646
    restart: unless-stopped
    expose:
      - '5222'
      - '5347'
      - '5280'
    volumes:
      - ./config/prosody/config:/config:Z
      - ./config/prosody/prosody-plugins-custom:/prosody-plugins-custom:Z
    environment:
      - AUTH_TYPE=jwt
      - JWT_APP_ID=${JWT_APP_ID:-meethub}
      - JWT_APP_SECRET=${JWT_APP_SECRET:-meethub_super_secret_jwt_key_2026_dev_32bytes}
      - JWT_ACCEPTED_ISSUERS=${JWT_APP_ID:-meethub}
      - JWT_ACCEPTED_AUDIENCES=${JWT_APP_ID:-meethub}
      - ENABLE_AUTH=1
      - ENABLE_GUESTS=1
      - XMPP_DOMAIN=meet.jitsi
      - XMPP_AUTH_DOMAIN=auth.meet.jitsi
      - XMPP_GUEST_DOMAIN=guest.meet.jitsi
      - XMPP_MUC_DOMAIN=muc.meet.jitsi
      - XMPP_INTERNAL_MUC_DOMAIN=internal-muc.meet.jitsi
      - PUBLIC_URL=${PUBLIC_URL:-https://meet.yourdomain.com}
    networks:
      meet.jitsi:
        aliases:
          - prosody

  # 3. Jicofo (Focus Component)
  jicofo:
    image: jitsi/jicofo:stable-9646
    restart: unless-stopped
    volumes:
      - ./config/jicofo:/config:Z
    environment:
      - AUTH_TYPE=jwt
      - XMPP_DOMAIN=meet.jitsi
      - XMPP_AUTH_DOMAIN=auth.meet.jitsi
      - XMPP_INTERNAL_MUC_DOMAIN=internal-muc.meet.jitsi
      - XMPP_MUC_DOMAIN=muc.meet.jitsi
      - XMPP_SERVER=prosody
      - JICOFO_AUTH_USER=focus
      - JICOFO_AUTH_PASSWORD=${JICOFO_AUTH_PASSWORD:-JicofoSecretPass2026}
    depends_on:
      - prosody
    networks:
      meet.jitsi:

  # 4. Jitsi Videobridge (JVB - WebRTC SFU Media Router)
  jvb:
    image: jitsi/jvb:stable-9646
    restart: unless-stopped
    ports:
      - "${JVB_PORT:-10000}:10000/udp"
      - "${JVB_TCP_PORT:-4443}:4443/tcp"
    volumes:
      - ./config/jvb:/config:Z
    environment:
      - DOCKER_HOST_ADDRESS=${DOCKER_HOST_ADDRESS:-127.0.0.1}
      - XMPP_AUTH_DOMAIN=auth.meet.jitsi
      - XMPP_INTERNAL_MUC_DOMAIN=internal-muc.meet.jitsi
      - XMPP_SERVER=prosody
      - JVB_AUTH_USER=jvb
      - JVB_AUTH_PASSWORD=${JVB_AUTH_PASSWORD:-JvbSecretPass2026}
      - JVB_PORT=10000
      - JVB_TCP_HARVESTER_PORT=4443
    depends_on:
      - prosody
    networks:
      meet.jitsi:

networks:
  meet.jitsi:

