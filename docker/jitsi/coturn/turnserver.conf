# Coturn TURN/STUN Configuration for MeetHub
listening-port=3478
tls-listening-port=5349

min-port=49152
max-port=65535

# Verbose logging
verbose
fingerprint
lt-cred-mech

# Realm and Secret
realm=turn.meethub.id
use-auth-secret
static-auth-secret=meethub_turn_static_secret_key_2026

# SSL Certificates (Let's Encrypt path)
cert=/etc/letsencrypt/live/turn.meethub.id/fullchain.pem
pkey=/etc/letsencrypt/live/turn.meethub.id/privkey.pem

no-cli
no-tcp-relay
stale-nonce=600

